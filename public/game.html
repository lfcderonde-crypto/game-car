// --- DAY/NIGHT CYCLE ---
function updateDayNight(delta){
  dayTime=(dayTime+delta*20)%24000;

  // Update admin time display
  if(adminOpen){
    const hrs=Math.floor(dayTime/1000);
    const mins=Math.floor((dayTime%1000)/1000*60);
    document.getElementById('tod-val').textContent=hrs+':'+(mins<10?'0':'')+mins;
  }

  // 0=midnight, 6000=dawn, 12000=noon, 18000=dusk
  const t=dayTime/24000; // 0-1
  const sunAngle=t*Math.PI*2-Math.PI/2;
  const r=200;
  scene.sun.position.set(
    camera.position.x+r*Math.cos(sunAngle),
    r*Math.sin(sunAngle),
    camera.position.z
  );
  scene.moon.position.set(
    camera.position.x-r*Math.cos(sunAngle),
    -r*Math.sin(sunAngle),
    camera.position.z
  );

  // Sky color
  let skyR,skyG,skyB,ambI,sunI;
  const nt=Math.abs(t-0.5)*2; // 0=noon,1=midnight
  if(nt<0.3){ // day
    skyR=0.53;skyG=0.81;skyB=0.98;ambI=0.7;sunI=1.0;
  } else if(nt<0.45){ // dawn/dusk
    const s=(nt-0.3)/0.15;
    skyR=lerp(0.53,0.1,s);skyG=lerp(0.81,0.1,s);skyB=lerp(0.98,0.15,s);
    ambI=lerp(0.7,0.1,s);sunI=lerp(1.0,0.2,s);
  } else { // night
    skyR=0.02;skyG=0.02;skyB=0.08;ambI=0.08;sunI=0.0;
  }
  renderer.setClearColor(new THREE.Color(skyR,skyG,skyB));
  scene.fog.color.setRGB(skyR,skyG,skyB);
  scene.ambientLight.intensity=ambI;
  scene.dirLight.intensity=sunI;
  scene.dirLight.position.copy(scene.sun.position);
  scene.dirLight.target.position.set(camera.position.x, camera.position.y, camera.position.z);
  if(!scene.dirLight.target.parent) scene.add(scene.dirLight.target);

  // Stars visibility
  scene.stars.material.opacity=nt>0.4?Math.min(1,(nt-0.4)/0.1):0;
  scene.stars.material.transparent=true;

  // HUD time
  const h=Math.floor(dayTime/1000);
  const m2=Math.floor((dayTime%1000)/1000*60);
  document.getElementById('sky-time').textContent=(nt<0.4?'☀':'🌙')+' '+h+':'+(m2<10?'0':'')+m2;
}

function lerp(a,b,t){return a+t*(b-a);}

// --- PHYSICS & MOVEMENT ---
let lastTime=0;
function resolvePlayerHorizontalCollision(){
  if(playerCollidesAt(camera.position.x,camera.position.y,camera.position.z)){
    camera.position.x=Math.round(camera.position.x)+0.5;
    camera.position.z=Math.round(camera.position.z)+0.5;
  }
}

function playerCollidesAt(x,y,z){
  const r=0.32;
  const y0=Math.floor(y-playerHeight+0.08);
  const y1=Math.floor(y-0.08);
  for(const yy of [y0,y1]){
    for(const dx of [-r,r]){
      for(const dz of [-r,r]){
        if(isSolidBlock(getBlock(Math.floor(x+dx),yy,Math.floor(z+dz)))) return true;
      }
    }
  }
  return false;
}

function blockHitsPlayer(x,y,z){
  const r=0.32;
  const minX=camera.position.x-r,maxX=camera.position.x+r;
  const minY=camera.position.y-playerHeight,maxY=camera.position.y+0.1;
  const minZ=camera.position.z-r,maxZ=camera.position.z+r;
  return x<maxX&&x+1>minX&&y<maxY&&y+1>minY&&z<maxZ&&z+1>minZ;
}

function movePlayerHorizontal(dx,dz){
  if(dx!==0){
    const old=camera.position.x;
    camera.position.x+=dx;
    if(playerCollidesAt(camera.position.x,camera.position.y,camera.position.z)) camera.position.x=old;
  }
  if(dz!==0){
    const old=camera.position.z;
    camera.position.z+=dz;
    if(playerCollidesAt(camera.position.x,camera.position.y,camera.position.z)) camera.position.z=old;
  }
}

function updateWaterOverlay(underwater){
  const overlay=document.getElementById('water-overlay');
  if(overlay) overlay.style.opacity=underwater?'1':'0';
}

function unstuckPlayer(){
  if(!playerStuckInBlock()) return;
  for(let i=1;i<=4;i++){
    if(!playerCollidesAt(camera.position.x,camera.position.y+i*0.25,camera.position.z)){
      camera.position.y+=i*0.25;
      velocity.y=Math.max(0,velocity.y);
      return;
    }
  }
}

function playerStuckInBlock(){
  const x=Math.floor(camera.position.x),z=Math.floor(camera.position.z);
  const feet=Math.floor(camera.position.y-playerHeight+0.18);
  const mid=Math.floor(camera.position.y-playerHeight*0.45);
  const head=Math.floor(camera.position.y-0.08);
  return isSolidBlock(getBlock(x,feet,z))||isSolidBlock(getBlock(x,mid,z))||isSolidBlock(getBlock(x,head,z));
}

function updatePhysics(delta){
  const isFlying = adminFly||flyMode;
  const bodyBlock=getBlock(Math.floor(camera.position.x),Math.floor(camera.position.y-playerHeight/2),Math.floor(camera.position.z));
  const headWater=getBlock(Math.floor(camera.position.x),Math.floor(camera.position.y),Math.floor(camera.position.z))===BLOCKS.WATER;
  const inWater = bodyBlock===BLOCKS.WATER||headWater;
  const feetWater=getBlock(Math.floor(camera.position.x),Math.floor(camera.position.y-playerHeight+0.15),Math.floor(camera.position.z))===BLOCKS.WATER;
  const sprinting=!inWater&&(keys['ShiftLeft']||keys['ShiftRight'])&&(keys['KeyW']||keys['KeyA']||keys['KeyS']||keys['KeyD']);
  const spd = isFlying?flySpeed:(inWater?moveSpeed*0.58:moveSpeed*(sprinting?sprintMultiplier:1));
  updateWaterOverlay(headWater);

  // Camera direction
  const euler=new THREE.Euler(0,yaw,0,'YXZ');
  const forward=new THREE.Vector3(0,0,-1).applyEuler(euler);
  const right=new THREE.Vector3(1,0,0).applyEuler(euler);

  let moveDx=0,moveDz=0;
  if(keys['KeyW']){moveDx+=forward.x;moveDz+=forward.z;}
  if(keys['KeyS']){moveDx-=forward.x;moveDz-=forward.z;}
  if(keys['KeyA']){moveDx-=right.x;moveDz-=right.z;}
  if(keys['KeyD']){moveDx+=right.x;moveDz+=right.z;}

  const acceleration = isFlying ? 32 : 26;
  const friction = isFlying ? 6 : 14;
  if(moveDx!==0||moveDz!==0){
    const len=Math.sqrt(moveDx*moveDx+moveDz*moveDz);
    const dirX=moveDx/len, dirZ=moveDz/len;
    hVelocity.x += dirX * acceleration * delta;
    hVelocity.z += dirZ * acceleration * delta;
    const maxSpeed = spd;
    const hvLen = Math.sqrt(hVelocity.x*hVelocity.x + hVelocity.z*hVelocity.z);
    if(hvLen > maxSpeed){
      hVelocity.x = hVelocity.x / hvLen * maxSpeed;
      hVelocity.z = hVelocity.z / hvLen * maxSpeed;
    }
  } else {
    const drag = Math.max(0, 1 - friction * delta);
    hVelocity.x *= drag;
    hVelocity.z *= drag;
    if(Math.abs(hVelocity.x) < 0.01) hVelocity.x = 0;
    if(Math.abs(hVelocity.z) < 0.01) hVelocity.z = 0;
  }

  if(hVelocity.x!==0||hVelocity.z!==0){
    if(isFlying){
      camera.position.x += hVelocity.x*delta;
      camera.position.z += hVelocity.z*delta;
    } else {
      movePlayerHorizontal(hVelocity.x*delta, hVelocity.z*delta);
    }
  }

  if(isFlying){
    if(keys['Space']) camera.position.y+=flySpeed*delta;
    if(keys['ShiftLeft']||keys['ShiftRight']) camera.position.y-=flySpeed*delta;
    velocity.y=0;
    maxFallSpeed=0;
  } else if(inWater) {
    velocity.y=Math.max(-2.2,velocity.y+gravity*0.18*delta);
    if(keys['Space']) velocity.y=Math.min(feetWater&&!headWater?6.5:4.5,velocity.y+14*delta);
    if(keys['ShiftLeft']||keys['ShiftRight']) velocity.y=Math.max(-4,velocity.y-8*delta);
    camera.position.y+=velocity.y*delta;
    const bx=Math.floor(camera.position.x);
    const by=Math.floor(camera.position.y-playerHeight);
    const bz=Math.floor(camera.position.z);
    const ground=getBlock(bx,by,bz);
    if(isSolidBlock(ground)&&camera.position.y-playerHeight<by+1+0.05){
      camera.position.y=by+1+playerHeight;
      velocity.y=0;
      onGround=true;
    }
    if(!isSolidBlock(ground)) onGround=false;
    maxFallSpeed=0;
    unstuckPlayer();
  } else {
    // Gravity
    velocity.y+=gravity*delta;
    camera.position.y+=velocity.y*delta;

    // Ground collision
    const bx=Math.floor(camera.position.x);
    const by=Math.floor(camera.position.y-playerHeight);
    const bz=Math.floor(camera.position.z);
    const ground=getBlock(bx,by,bz);
    if(isSolidBlock(ground)&&camera.position.y-playerHeight<by+1+0.05){
      const landingSpeed=Math.max(maxFallSpeed,-velocity.y);
      camera.position.y=by+1+playerHeight;
      velocity.y=0;
      onGround=true;
      if(landingSpeed>12&&!adminGod&&!godMode){
        const dmg=Math.floor((landingSpeed-10)/2);
        health=Math.max(0,health-dmg);
        updateHealthUI();
        if(dmg>0) showMsg('Ouch! Fall damage: '+dmg);
      }
      maxFallSpeed=0;
    } else {
      onGround=false;
      if(velocity.y<0) maxFallSpeed=Math.max(maxFallSpeed,-velocity.y);
    }

    // Ceiling
    const headB=getBlock(Math.floor(camera.position.x),Math.floor(camera.position.y+0.2),Math.floor(camera.position.z));
    if(isSolidBlock(headB)){velocity.y=Math.min(0,velocity.y);}

    // Water buoyancy is handled by the swimming branch.
    unstuckPlayer();
  }

  // Resolve minor horizontal collisions and apply camera orientation
  resolvePlayerHorizontalCollision();
  camera.rotation.order='YXZ';
  camera.rotation.y=yaw;
  camera.rotation.x=pitch;

  // HUD
  const p=camera.position;
  document.getElementById('pos-info').textContent=`X:${p.x.toFixed(1)} Y:${p.y.toFixed(1)} Z:${p.z.toFixed(1)}`;
  const mobHit=raycastMob();
  const hit=raycastBlock();
  document.getElementById('look-info').textContent=mobHit?`Mob: ${mobHit.mob.type}`:(hit?`Block: ${BLOCK_NAMES[hit.type]||hit.type}`:'Looking at: -');
  document.getElementById('mode-info').textContent=(adminFly||flyMode)?'✈ FLY':(adminGod?'☆ GOD':'');
  document.getElementById('mp-info').textContent=multiplayerEnabled ? `MP: ${Object.keys(remotePlayers).length} peer(s)` : '';
}

// --- MAIN LOOP ---
function loop(ts=0){
  requestAnimationFrame(loop);
  const delta=Math.min((ts-lastTime)/1000,0.1);
  lastTime=ts;
  if(delta<=0||!locked&&!inventoryOpen&&!adminOpen) {
    renderer.render(scene,camera);
    return;
  }
  updateDayNight(delta);
  updateMobs(delta);
  if(locked) {
    updatePhysics(delta);
    updateMining(delta);
    updateProjectiles(delta);
    updateDrops(delta);
    if(multiplayerEnabled && ts-lastPlayerStateSent > 120){ sendPlayerState(); lastPlayerStateSent = ts; }
    if(multiplayerEnabled && ts-lastWorldSave > 5000){ saveMPWorld(); lastWorldSave = ts; }
    cleanupStaleRemotePlayers();
    updateMultiplayerHUD();
  }
  renderer.render(scene,camera);
}

init();
</script>
</body>
</html>
